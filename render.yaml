services:
  # --- Backend: FastAPI + WebSocket, Dockerized ---
  - type: web
    name: schedulerai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      # Which model backs the agent: ollama | gemini | mock.
      # `mock` is a deterministic rule table needing no key, so the deployed
      # dashboard still runs end-to-end without one.
      - key: AGENT_PROVIDER
        value: mock
      - key: OLLAMA_BASE_URL
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:120b-cloud
      - key: OLLAMA_API_KEY
        sync: false # set manually in the Render dashboard — never commit this
      - key: GEMINI_API_KEY
        sync: false # set manually in the Render dashboard — never commit this
      - key: CORS_ORIGINS
        value: https://schedulerai-frontend-qdi1.onrender.com
    # No persistent disk on the free plan — DATABASE_URL falls back to the
    # Dockerfile's default (sqlite+aiosqlite:///simulation.db), which lives
    # on the container's ephemeral filesystem and resets on every redeploy
    # or free-tier spin-down. Upgrade to a paid plan and add a `disk:` block
    # (or switch to a Postgres add-on) if you need data to persist.

  # --- Frontend: static Vite build ---
  - type: web
    name: schedulerai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://schedulerai-backend-qdi1.onrender.com
      - key: VITE_WEBSOCKET_URL
        value: wss://schedulerai-backend-qdi1.onrender.com/api/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
